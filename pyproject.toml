[project]
name = "freightbench"
version = "0.3.0"
description = "An evaluation benchmark for agents that extract structured bookings from freight-forwarding emails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Puri" }]
dependencies = []

[project.scripts]
freightbench = "freightbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
